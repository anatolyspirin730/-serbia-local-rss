name: Build Subotica Electricity RSS
on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: write
concurrency:
  group: subotica-electricity
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Build outage RSS
        run: python build_subotica_electricity.py
      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subotica-electricity-diagnostic
          path: electricity_diagnostic.json
          if-no-files-found: warn
      - name: Commit verified RSS only
        run: |
          if [ ! -f feeds/special-electricity.xml ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feeds/special-electricity.xml
          if ! git diff --cached --quiet; then
            git commit -m 'Update Subotica planned electricity outages RSS'
            git push
          fi
