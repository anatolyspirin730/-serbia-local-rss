name: Build Subotica Cistoca RSS

'on':
  workflow_dispatch:
  schedule:
   - cron: '23,53 * * * *'
permissions:
  contents: write
concurrency:
  group: subotica-cistoca
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Update Cistoca RSS
        run: python build_subotica_cistoca.py
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subotica-cistoca-report
          path: audit-results/cistoca_report.json
      - name: Commit Cistoca RSS only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feeds/special-cistoca.xml 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Update Subotica Cistoca RSS'
            git pull --rebase origin main
            git push
          fi
