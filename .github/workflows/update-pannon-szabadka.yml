name: Update Pannon Szabadka RSS
on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
permissions:
  contents: write
concurrency:
  group: pannon-szabadka-rss
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: pip install requests
      - name: Build filtered feeds
        run: python pannon_szabadka.py
      - name: Commit feeds
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # The parser intentionally does not create an empty feed when no articles match.
          # Stage only files that actually exist, avoiding git pathspec exit code 128.
          for feed in feeds/pannon-szabadka.xml feeds/pannon-szabadka-service.xml; do
            if [ -f "$feed" ]; then
              git add -- "$feed"
            else
              echo "NOTICE: $feed does not exist yet (no matching articles); skipping"
            fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Update Pannon Szabadka RSS feeds'
            git pull --rebase
            git push
          fi
          echo "Pannon RSS commit step completed successfully"
