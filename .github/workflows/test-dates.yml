name: Test Article Publication Dates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-dates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test publication dates
        run: python test_dates.py
