name: Build Subotica Custom RSS

on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: write

concurrency:
  group: subotica-custom-feeds
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4 python-dateutil
      - name: Build custom RSS
        run: python build_custom_feeds.py
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subotica-custom-feeds-report
          path: audit-results/custom_feeds_report.json
          if-no-files-found: warn
      - name: Commit updated feeds
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feeds/custom-*.xml
          if ! git diff --cached --quiet; then
            git commit -m 'Update custom Subotica RSS feeds'
            git push
          else
            echo 'No new dated articles; no feed changes'
          fi
